version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - 9090:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: midoc-digital-twin
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  carla-adapter:
    build: ./carla-adapter
    container_name: carla-adapter
    depends_on:
      - kafka
    ports:
      - 8084:8084
    environment:
      MOCK_MODE: "false"
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: carla-state
      CARLA_HOST: "host.docker.internal"
      CARLA_PORT: 2000
      API_HOST: "0.0.0.0"
      API_PORT: 8084
    extra_hosts:
      - "host.docker.internal:host-gateway"

  orchestrator-service:
    build: ./orchestrator-service
    container_name: orchestrator-service
    depends_on:
      - kafka
    ports:
      - 8086:8080
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8080

  gama-adapter:
    build: ./gama-adapter
    container_name: gama-adapter
    depends_on:
      - kafka
    ports:
      - 8082:8082
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8082
      GAMA_SERVER_URL: ws://host.docker.internal:6868
      GAMA_MODEL_PATH: "/home/chaymae/gama-simulation05052025/gama-simulation/models/mobilitySimulator/Launcher.gaml"
    extra_hosts:
      - "host.docker.internal:host-gateway"

