<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDOC Digital Twin — Diagramme de Composants</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .diagram-container {
            width: 1100px;
            padding: 30px;
        }

        .diagram-title {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            letter-spacing: 0.3px;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* UML Component style */
        .component-box {
            fill: #fefefe;
            stroke: #333;
            stroke-width: 1.5;
        }
        .component-label {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            fill: #222;
            text-anchor: middle;
        }
        .component-stereotype {
            font-family: 'Inter', sans-serif;
            font-size: 9px;
            font-weight: 400;
            fill: #666;
            text-anchor: middle;
            font-style: italic;
        }
        .component-tab {
            fill: #fefefe;
            stroke: #333;
            stroke-width: 1.2;
        }

        .package-box {
            fill: none;
            stroke: #555;
            stroke-width: 1.2;
            stroke-dasharray: 6 3;
        }
        .package-label {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            fill: #444;
        }
        .package-tab {
            fill: #f5f5f5;
            stroke: #555;
            stroke-width: 1.2;
        }

        .interface-circle {
            fill: #fff;
            stroke: #333;
            stroke-width: 1.5;
        }
        .interface-label {
            font-family: 'Inter', sans-serif;
            font-size: 8.5px;
            fill: #444;
            text-anchor: middle;
        }

        .connector {
            stroke: #444;
            stroke-width: 1.2;
            fill: none;
        }
        .connector-dashed {
            stroke: #444;
            stroke-width: 1.2;
            fill: none;
            stroke-dasharray: 5 3;
        }

        .arrow-head {
            fill: #444;
            stroke: none;
        }
        .arrow-head-open {
            fill: none;
            stroke: #444;
            stroke-width: 1.2;
        }

        .port {
            fill: #fff;
            stroke: #333;
            stroke-width: 1.2;
        }

        .note-box {
            fill: #fffde7;
            stroke: #ccc;
            stroke-width: 1;
        }
        .note-text {
            font-family: 'Inter', sans-serif;
            font-size: 8px;
            fill: #555;
        }

        .topic-label {
            font-family: 'Inter', sans-serif;
            font-size: 8px;
            fill: #1565c0;
            font-style: italic;
        }

        .sub-component-box {
            fill: #f9f9f9;
            stroke: #888;
            stroke-width: 1;
        }
        .sub-component-label {
            font-family: 'Inter', sans-serif;
            font-size: 9px;
            font-weight: 500;
            fill: #444;
            text-anchor: middle;
        }

        .figure-caption {
            text-align: center;
            font-size: 12px;
            color: #333;
            margin-top: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <svg viewBox="0 0 1050 620" xmlns="http://www.w3.org/2000/svg">
            <!-- ════════════════════════════════════════════ -->
            <!-- EXTERNAL SYSTEMS (top-right and right side) -->
            <!-- ════════════════════════════════════════════ -->

            <!-- CARLA Simulator (external) -->
            <rect x="870" y="60" width="150" height="55" rx="3" class="component-box" style="fill:#e3f2fd"/>
            <rect x="862" y="72" width="14" height="8" rx="1" class="component-tab" style="fill:#e3f2fd"/>
            <rect x="862" y="83" width="14" height="8" rx="1" class="component-tab" style="fill:#e3f2fd"/>
            <text x="945" y="83" class="component-stereotype">«external»</text>
            <text x="945" y="99" class="component-label">CARLA Simulator</text>

            <!-- GAMA Platform (external) -->
            <rect x="870" y="280" width="150" height="55" rx="3" class="component-box" style="fill:#e8f5e9"/>
            <rect x="862" y="292" width="14" height="8" rx="1" class="component-tab" style="fill:#e8f5e9"/>
            <rect x="862" y="303" width="14" height="8" rx="1" class="component-tab" style="fill:#e8f5e9"/>
            <text x="945" y="303" class="component-stereotype">«external»</text>
            <text x="945" y="319" class="component-label">GAMA Platform</text>

            <!-- ════════════════════════════════════════════ -->
            <!-- MAIN SYSTEM PACKAGE -->
            <!-- ════════════════════════════════════════════ -->
            <rect x="20" y="15" width="820" height="590" rx="4" class="package-box"/>
            <rect x="20" y="0" width="250" height="20" rx="3" class="package-tab"/>
            <text x="30" y="14" class="package-label">«system» MIDOC Digital Twin</text>

            <!-- ════════════════════════════════════════════ -->
            <!-- MESSAGE BROKER (Kafka) - Center -->
            <!-- ════════════════════════════════════════════ -->
            <rect x="330" y="200" width="200" height="200" rx="4" class="component-box" style="fill:#fff8e1"/>
            <rect x="322" y="212" width="14" height="8" rx="1" class="component-tab" style="fill:#fff8e1"/>
            <rect x="322" y="225" width="14" height="8" rx="1" class="component-tab" style="fill:#fff8e1"/>
            <text x="430" y="225" class="component-stereotype">«infrastructure»</text>
            <text x="430" y="242" class="component-label">Message Broker</text>
            <text x="430" y="255" class="component-stereotype">(Apache Kafka)</text>

            <!-- Kafka Topics as sub-components -->
            <rect x="345" y="268" width="170" height="22" rx="2" class="sub-component-box"/>
            <text x="430" y="283" class="sub-component-label">gama-state</text>

            <rect x="345" y="296" width="170" height="22" rx="2" class="sub-component-box"/>
            <text x="430" y="311" class="sub-component-label">carla-state</text>

            <rect x="345" y="324" width="170" height="22" rx="2" class="sub-component-box"/>
            <text x="430" y="339" class="sub-component-label">carla-commands</text>

            <rect x="345" y="352" width="170" height="22" rx="2" class="sub-component-box"/>
            <text x="430" y="367" class="sub-component-label">gama-commands</text>

            <!-- ════════════════════════════════════════════ -->
            <!-- CARLA ADAPTER - Top Right -->
            <!-- ════════════════════════════════════════════ -->
            <rect x="620" y="40" width="200" height="115" rx="4" class="component-box" style="fill:#e3f2fd"/>
            <rect x="612" y="52" width="14" height="8" rx="1" class="component-tab" style="fill:#e3f2fd"/>
            <rect x="612" y="65" width="14" height="8" rx="1" class="component-tab" style="fill:#e3f2fd"/>
            <text x="720" y="65" class="component-stereotype">«adapter»</text>
            <text x="720" y="82" class="component-label">CARLA Adapter</text>
            <text x="720" y="95" class="component-stereotype">(Python / FastAPI)</text>

            <!-- Sub-components -->
            <rect x="632" y="105" width="85" height="20" rx="2" class="sub-component-box"/>
            <text x="674" y="118" class="sub-component-label">KafkaProducer</text>
            <rect x="723" y="105" width="88" height="20" rx="2" class="sub-component-box"/>
            <text x="767" y="118" class="sub-component-label">CommandConsumer</text>
            <rect x="632" y="128" width="85" height="20" rx="2" class="sub-component-box"/>
            <text x="674" y="141" class="sub-component-label">CarlaConnector</text>
            <rect x="723" y="128" width="88" height="20" rx="2" class="sub-component-box"/>
            <text x="767" y="141" class="sub-component-label">DataTransformer</text>

            <!-- CARLA Adapter → CARLA Simulator (Python API) -->
            <line x1="820" y1="87" x2="870" y2="87" class="connector"/>
            <polygon points="868,84 875,87 868,90" class="arrow-head"/>
            <text x="845" y="80" class="topic-label" text-anchor="middle">Python API</text>

            <!-- CARLA Adapter → Kafka (publish carla-state) -->
            <line x1="720" y1="155" x2="720" y2="200" class="connector" style="stroke:#1565c0"/>
            <polygon points="717,198 720,205 723,198" class="arrow-head" style="fill:#1565c0"/>
            <text x="755" y="180" class="topic-label">carla-state</text>

            <!-- Kafka → CARLA Adapter (consume carla-commands) -->
            <line x1="530" y1="130" x2="620" y2="96" class="connector-dashed" style="stroke:#c62828"/>
            <polygon points="618,93 625,94 619,99" class="arrow-head" style="fill:#c62828"/>
            <text x="555" y="100" class="topic-label">carla-commands</text>

            <!-- ════════════════════════════════════════════ -->
            <!-- GAMA ADAPTER - Right middle -->
            <!-- ════════════════════════════════════════════ -->
            <rect x="620" y="250" width="200" height="115" rx="4" class="component-box" style="fill:#e8f5e9"/>
            <rect x="612" y="262" width="14" height="8" rx="1" class="component-tab" style="fill:#e8f5e9"/>
            <rect x="612" y="275" width="14" height="8" rx="1" class="component-tab" style="fill:#e8f5e9"/>
            <text x="720" y="275" class="component-stereotype">«adapter»</text>
            <text x="720" y="292" class="component-label">GAMA Adapter</text>
            <text x="720" y="305" class="component-stereotype">(Java / Spring Boot)</text>

            <!-- Sub-components -->
            <rect x="632" y="315" width="85" height="20" rx="2" class="sub-component-box"/>
            <text x="674" y="328" class="sub-component-label">KafkaProducer</text>
            <rect x="723" y="315" width="88" height="20" rx="2" class="sub-component-box"/>
            <text x="767" y="328" class="sub-component-label">CommandConsumer</text>
            <rect x="632" y="338" width="85" height="20" rx="2" class="sub-component-box"/>
            <text x="674" y="351" class="sub-component-label">WebSocketClient</text>
            <rect x="723" y="338" width="88" height="20" rx="2" class="sub-component-box"/>
            <text x="767" y="351" class="sub-component-label">DataTransformer</text>

            <!-- GAMA Adapter → GAMA Platform (WebSocket) -->
            <line x1="820" y1="307" x2="870" y2="307" class="connector"/>
            <polygon points="868,304 875,307 868,310" class="arrow-head"/>
            <text x="845" y="300" class="topic-label" text-anchor="middle">WebSocket</text>

            <!-- GAMA Adapter → Kafka (publish gama-state) -->
            <line x1="620" y1="280" x2="530" y2="280" class="connector" style="stroke:#2e7d32"/>
            <polygon points="532,277 525,280 532,283" class="arrow-head" style="fill:#2e7d32"/>
            <text x="575" y="273" class="topic-label">gama-state</text>

            <!-- Kafka → GAMA Adapter (consume gama-commands) -->
            <line x1="530" y1="365" x2="620" y2="345" class="connector-dashed" style="stroke:#c62828"/>
            <polygon points="618,342 625,343 619,348" class="arrow-head" style="fill:#c62828"/>
            <text x="555" y="365" class="topic-label">gama-commands</text>

            <!-- ════════════════════════════════════════════ -->
            <!-- CO-SIMULATION ENGINE (Orchestrator) - Top Left -->
            <!-- ════════════════════════════════════════════ -->
            <rect x="45" y="40" width="250" height="175" rx="4" class="component-box" style="fill:#fce4ec"/>
            <rect x="37" y="52" width="14" height="8" rx="1" class="component-tab" style="fill:#fce4ec"/>
            <rect x="37" y="65" width="14" height="8" rx="1" class="component-tab" style="fill:#fce4ec"/>
            <text x="170" y="65" class="component-stereotype">«service»</text>
            <text x="170" y="82" class="component-label">Moteur de Co-Simulation</text>
            <text x="170" y="95" class="component-stereotype">(Java / Spring Boot)</text>

            <!-- Sub-components of Orchestrator -->
            <rect x="57" y="108" width="110" height="22" rx="2" class="sub-component-box"/>
            <text x="112" y="123" class="sub-component-label">CoSimulationEngine</text>

            <rect x="173" y="108" width="110" height="22" rx="2" class="sub-component-box"/>
            <text x="228" y="123" class="sub-component-label">StateManager</text>

            <rect x="57" y="136" width="110" height="22" rx="2" class="sub-component-box"/>
            <text x="112" y="151" class="sub-component-label">GamaStateConsumer</text>

            <rect x="173" y="136" width="110" height="22" rx="2" class="sub-component-box"/>
            <text x="228" y="151" class="sub-component-label">CarlaStateConsumer</text>

            <rect x="57" y="164" width="110" height="22" rx="2" class="sub-component-box"/>
            <text x="112" y="179" class="sub-component-label">CommandProducer</text>

            <!-- Rules sub-package -->
            <rect x="173" y="164" width="110" height="40" rx="2" style="fill:#fce4ec;stroke:#888;stroke-width:1;stroke-dasharray:3 2"/>
            <text x="228" y="178" class="sub-component-label" style="font-style:italic;font-size:7.5px">«rules» ECA</text>
            <text x="228" y="191" class="sub-component-label" style="font-size:7px">Congestion | Collision</text>
            <text x="228" y="201" class="sub-component-label" style="font-size:7px">PedestrianDensity | Pollution</text>

            <!-- Orchestrator → Kafka (consume gama-state, carla-state) -->
            <line x1="170" y1="215" x2="170" y2="280" class="connector-dashed" style="stroke:#2e7d32"/>
            <line x1="170" y1="280" x2="330" y2="280" class="connector-dashed" style="stroke:#2e7d32"/>
            <polygon points="168,213 170,206 172,213" class="arrow-head" style="fill:#2e7d32"/>
            <text x="235" y="273" class="topic-label">gama-state, carla-state</text>

            <!-- Orchestrator → Kafka (produce commands) -->
            <line x1="120" y1="215" x2="120" y2="340" class="connector" style="stroke:#c62828"/>
            <line x1="120" y1="340" x2="330" y2="340" class="connector" style="stroke:#c62828"/>
            <polygon points="328,337 335,340 328,343" class="arrow-head" style="fill:#c62828"/>
            <text x="200" y="350" class="topic-label">carla-commands, gama-commands</text>

            <!-- ════════════════════════════════════════════ -->
            <!-- DASHBOARD SERVICE - Bottom Left -->
            <!-- ════════════════════════════════════════════ -->
            <rect x="45" y="430" width="250" height="155" rx="4" class="component-box" style="fill:#ede7f6"/>
            <rect x="37" y="442" width="14" height="8" rx="1" class="component-tab" style="fill:#ede7f6"/>
            <rect x="37" y="455" width="14" height="8" rx="1" class="component-tab" style="fill:#ede7f6"/>
            <text x="170" y="458" class="component-stereotype">«service»</text>
            <text x="170" y="475" class="component-label">Dashboard Service</text>

            <!-- Dashboard Backend -->
            <rect x="57" y="490" width="110" height="42" rx="2" class="sub-component-box"/>
            <text x="112" y="507" class="sub-component-label">Backend</text>
            <text x="112" y="520" class="sub-component-label" style="font-size:7.5px;fill:#777">(Python / FastAPI)</text>
            <text x="112" y="530" class="sub-component-label" style="font-size:7px;fill:#888">KafkaConsumer + WS</text>

            <!-- Dashboard Frontend -->
            <rect x="173" y="490" width="110" height="42" rx="2" class="sub-component-box"/>
            <text x="228" y="507" class="sub-component-label">Frontend</text>
            <text x="228" y="520" class="sub-component-label" style="font-size:7.5px;fill:#777">(React.js)</text>
            <text x="228" y="530" class="sub-component-label" style="font-size:7px;fill:#888">Visualisation temps réel</text>

            <!-- Backend → Frontend (WebSocket) -->
            <line x1="167" y1="511" x2="173" y2="511" class="connector"/>
            <text x="170" y="548" class="topic-label">WebSocket</text>

            <!-- Dashboard → Kafka (consume) -->
            <line x1="170" y1="430" x2="170" y2="400" class="connector-dashed" style="stroke:#2e7d32"/>
            <line x1="170" y1="400" x2="430" y2="400" class="connector-dashed" style="stroke:#2e7d32"/>
            <polygon points="168,432 170,439 172,432" class="arrow-head" style="fill:#2e7d32"/>
            <text x="280" y="395" class="topic-label">gama-state, carla-state, carla-commands</text>

            <!-- ════════════════════════════════════════════ -->
            <!-- EXTERNAL CLIENTS -->
            <!-- ════════════════════════════════════════════ -->

            <!-- 3D Visualizer (Unity) -->
            <rect x="370" y="500" width="140" height="55" rx="3" class="component-box" style="fill:#f3e5f5"/>
            <rect x="362" y="512" width="14" height="8" rx="1" class="component-tab" style="fill:#f3e5f5"/>
            <rect x="362" y="523" width="14" height="8" rx="1" class="component-tab" style="fill:#f3e5f5"/>
            <text x="440" y="523" class="component-stereotype">«external»</text>
            <text x="440" y="539" class="component-label">Visualisateur 3D</text>
            <text x="440" y="551" class="component-stereotype">(Unity)</text>

            <!-- Unity → Dashboard/Kafka -->
            <line x1="370" y1="527" x2="295" y2="527" class="connector-dashed"/>
            <polygon points="297,524 290,527 297,530" class="arrow-head"/>
            <text x="333" y="520" class="topic-label">REST / WS</text>

            <!-- ════════════════════════════════════════════ -->
            <!-- PROVIDED/REQUIRED INTERFACES (lollipop notation) -->
            <!-- ════════════════════════════════════════════ -->

            <!-- Orchestrator REST API (provided interface) -->
            <line x1="45" y1="127" x2="30" y2="127" class="connector"/>
            <circle cx="27" cy="127" r="4" class="interface-circle"/>
            <text x="15" y="140" class="interface-label">REST</text>
            <text x="15" y="149" class="interface-label">/api</text>

            <!-- CARLA Adapter REST API (provided interface) -->
            <line x1="620" y1="65" x2="605" y2="65" class="connector"/>
            <circle cx="602" cy="65" r="4" class="interface-circle"/>
            <text x="594" y="55" class="interface-label">REST</text>

            <!-- Dashboard REST + WS (provided interface) -->
            <line x1="45" y1="508" x2="30" y2="508" class="connector"/>
            <circle cx="27" cy="508" r="4" class="interface-circle"/>
            <text x="15" y="521" class="interface-label">REST</text>
            <text x="15" y="530" class="interface-label">+ WS</text>

            <!-- ════════════════════════════════════════════ -->
            <!-- LEGEND -->
            <!-- ════════════════════════════════════════════ -->
            <rect x="570" y="440" width="250" height="145" rx="3" style="fill:#fafafa;stroke:#ccc;stroke-width:1"/>
            <text x="695" y="458" class="component-label" style="font-size:10px">Légende</text>

            <!-- Component -->
            <rect x="585" y="468" width="30" height="16" rx="2" style="fill:#fff;stroke:#333;stroke-width:1"/>
            <rect x="581" y="472" width="6" height="4" rx="0.5" style="fill:#fff;stroke:#333;stroke-width:0.8"/>
            <rect x="581" y="478" width="6" height="4" rx="0.5" style="fill:#fff;stroke:#333;stroke-width:0.8"/>
            <text x="625" y="480" style="font-family:'Inter';font-size:9px;fill:#333">Composant UML</text>

            <!-- Provided interface -->
            <line x1="585" y1="497" x2="600" y2="497" style="stroke:#333;stroke-width:1"/>
            <circle cx="603" cy="497" r="3.5" style="fill:#fff;stroke:#333;stroke-width:1"/>
            <text x="625" y="500" style="font-family:'Inter';font-size:9px;fill:#333">Interface fournie</text>

            <!-- Publish (solid) -->
            <line x1="585" y1="517" x2="615" y2="517" style="stroke:#1565c0;stroke-width:1.2"/>
            <polygon points="612,514.5 618,517 612,519.5" style="fill:#1565c0"/>
            <text x="625" y="520" style="font-family:'Inter';font-size:9px;fill:#333">Publication (Kafka)</text>

            <!-- Subscribe (dashed) -->
            <line x1="585" y1="537" x2="615" y2="537" style="stroke:#2e7d32;stroke-width:1.2;stroke-dasharray:4 2"/>
            <polygon points="583,534.5 578,537 583,539.5" style="fill:#2e7d32"/>
            <text x="625" y="540" style="font-family:'Inter';font-size:9px;fill:#333">Consommation (Kafka)</text>

            <!-- Command -->
            <line x1="585" y1="557" x2="615" y2="557" style="stroke:#c62828;stroke-width:1.2"/>
            <polygon points="612,554.5 618,557 612,559.5" style="fill:#c62828"/>
            <text x="625" y="560" style="font-family:'Inter';font-size:9px;fill:#333">Commande (ECA)</text>

            <!-- External -->
            <rect x="585" y="567" width="30" height="12" rx="2" style="fill:#e3f2fd;stroke:#333;stroke-width:0.8"/>
            <text x="625" y="577" style="font-family:'Inter';font-size:9px;fill:#333">Système externe</text>
        </svg>

        <p class="figure-caption">F<span style="font-variant:small-caps">IGURE</span> 3.1 – Diagramme de composants de l'architecture proposée</p>
    </div>
</body>
</html>
