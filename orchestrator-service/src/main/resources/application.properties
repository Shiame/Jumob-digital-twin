# ═══════════════════════════════════════════════════════════════
#  Co-Simulation Engine — Application Configuration
# ═══════════════════════════════════════════════════════════════

spring.application.name=orchestrator-service
server.port=8087

# --- Kafka ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=cosimulation-engine
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Kafka Topics ---
kafka.topic.gama-state=gama-state
kafka.topic.carla-state=carla-state
kafka.topic.carla-commands=carla-commands
kafka.topic.gama-commands=gama-commands

# --- Co-Simulation Rule Thresholds ---

# Pedestrian density (legacy road-based — disabled, kept for reference)
cosim.rules.pedestrian-density.high-threshold=2
cosim.rules.pedestrian-density.high-speed-limit=20
cosim.rules.pedestrian-density.medium-threshold=1
cosim.rules.pedestrian-density.medium-speed-limit=30

# Pedestrian density (geo-proximity — active)
cosim.rules.geo-proximity.radius-meters=30
cosim.rules.geo-proximity.high-threshold=10
cosim.rules.geo-proximity.high-speed-limit=20
cosim.rules.geo-proximity.medium-threshold=5
cosim.rules.geo-proximity.medium-speed-limit=30
cosim.rules.geo-proximity.normal-speed-limit=50

cosim.rules.congestion.threshold=0.8

cosim.rules.pollution.threshold=0.9

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
