apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: /tmp/kompose_bin convert -f docker-compose.yml --out k8s/kompose-output/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: carla-adapter
  name: carla-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: carla-adapter
  template:
    metadata:
      annotations:
        kompose.cmd: /tmp/kompose_bin convert -f docker-compose.yml --out k8s/kompose-output/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: carla-adapter
    spec:
      containers:
        - env:
            - name: API_HOST
              value: 0.0.0.0
            - name: API_PORT
              value: "8084"
            - name: CARLA_HOST
              value: host.docker.internal
            - name: CARLA_PORT
              value: "2000"
            - name: KAFKA_BROKER
              value: kafka:29092
            - name: KAFKA_TOPIC
              value: carla-state
            - name: MOCK_MODE
              value: "false"
          image: carla-adapter
          name: carla-adapter
          ports:
            - containerPort: 8084
              protocol: TCP
      restartPolicy: Always
