apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: /tmp/kompose_bin convert -f docker-compose.yml --out k8s/kompose-output/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: gama-adapter
  name: gama-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: gama-adapter
  template:
    metadata:
      annotations:
        kompose.cmd: /tmp/kompose_bin convert -f docker-compose.yml --out k8s/kompose-output/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: gama-adapter
    spec:
      containers:
        - env:
            - name: GAMA_MODEL_PATH
              value: /home/chaymae/gama-simulation05052025/gama-simulation/models/mobilitySimulator/Launcher.gaml
            - name: GAMA_SERVER_URL
              value: ws://host.docker.internal:6868
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
          image: gama-adapter
          name: gama-adapter
          ports:
            - containerPort: 8082
              protocol: TCP
      restartPolicy: Always
