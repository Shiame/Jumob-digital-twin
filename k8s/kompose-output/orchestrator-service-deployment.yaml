apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: /tmp/kompose_bin convert -f docker-compose.yml --out k8s/kompose-output/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: orchestrator-service
  name: orchestrator-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: orchestrator-service
  template:
    metadata:
      annotations:
        kompose.cmd: /tmp/kompose_bin convert -f docker-compose.yml --out k8s/kompose-output/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: orchestrator-service
    spec:
      containers:
        - env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
          image: orchestrator-service
          name: orchestrator-service
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
