# ═══════════════════════════════════════════════════════════
#  Kafka — ClusterIP Service
#  Internal-only: accessible at kafka.midoc-dt.svc.cluster.local
# ═══════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: midoc-dt
  labels:
    app: kafka
    app.kubernetes.io/part-of: midoc-digital-twin
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: internal
      port: 29092
      targetPort: 29092
    - name: external
      port: 9092
      targetPort: 9092
