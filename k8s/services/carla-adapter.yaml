# ═══════════════════════════════════════════════════════════
#  CARLA Adapter — Deployment + Service
#  Bridges the CARLA simulator (on-premises) with the
#  cloud-based Digital Twin platform via Kafka
#
#  HYBRID ARCHITECTURE:
#  This adapter runs in GKE and connects OUTBOUND to the
#  CARLA simulator running on an on-premises GPU server
#  via Tailscale VPN (edge-cloud pattern)
# ═══════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carla-adapter
  namespace: midoc-dt
  labels:
    app: carla-adapter
    app.kubernetes.io/part-of: midoc-digital-twin
    app.kubernetes.io/component: adapter
    tier: edge-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carla-adapter
  template:
    metadata:
      labels:
        app: carla-adapter
        app.kubernetes.io/part-of: midoc-digital-twin
        tier: edge-connector
    spec:
      # Wait for Kafka before starting
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka..."
              until nc -z kafka.midoc-dt.svc.cluster.local 29092; do
                sleep 3
              done
              echo "Kafka is ready!"
      containers:
        - name: carla-adapter
          # Image will be pushed to Google Artifact Registry
          # Updated by CI/CD pipeline
          image: europe-west1-docker.pkg.dev/midoc-digital-twin/midoc/carla-adapter:latest
          ports:
            - containerPort: 8084
              name: api
          env:
            # ── Kafka Configuration (from ConfigMap) ──
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_BROKER
            - name: KAFKA_TOPIC
              value: "carla-state"
            # ── CARLA Simulator Connection (Hybrid/Edge) ──
            - name: CARLA_HOST
              valueFrom:
                configMapKeyRef:
                  name: simulator-config
                  key: CARLA_HOST
            - name: CARLA_PORT
              valueFrom:
                configMapKeyRef:
                  name: simulator-config
                  key: CARLA_PORT
            # ── API Configuration ──
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "8084"
            - name: MOCK_MODE
              value: "true"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: carla-adapter
  namespace: midoc-dt
  labels:
    app: carla-adapter
spec:
  type: ClusterIP
  selector:
    app: carla-adapter
  ports:
    - name: api
      port: 8084
      targetPort: 8084
